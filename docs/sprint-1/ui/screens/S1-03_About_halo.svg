<text x="195.0" y="214.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#2B2B2B" text-anchor="middle">About halo</text>
<text x="24.0" y="256.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#333333" text-anchor="start">halo is a migraine care companion. Log an attack</text>
<text x="24.0" y="278.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#333333" text-anchor="start">in a few taps or by voice, and keep a list of the</text>
<text x="24.0" y="300.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#333333" text-anchor="start">medications you take. It works with or without</text>
<text x="24.0" y="322.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#333333" text-anchor="start">internet and syncs to the cloud when you're</text>
<text x="24.0" y="344.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#333333" text-anchor="start">back online.</text>
<circle cx="80.0" cy="418.0" r="26" fill="#EDEDED" stroke="#BDBDBD" stroke-width="1.2"/>
<text x="80.0" y="423.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#6E6E6E" text-anchor="middle">Q</text>
<text x="80.0" y="470.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#333333" text-anchor="middle">Quick logging</text>
<circle cx="195.0" cy="418.0" r="26" fill="#EDEDED" stroke="#BDBDBD" stroke-width="1.2"/>
<text x="195.0" y="423.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#6E6E6E" text-anchor="middle">V</text>
<text x="195.0" y="470.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#333333" text-anchor="middle">Voice notes</text>
<circle cx="310.0" cy="418.0" r="26" fill="#EDEDED" stroke="#BDBDBD" stroke-width="1.2"/>
<text x="310.0" y="423.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#6E6E6E" text-anchor="middle">O</text>
<text x="310.0" y="470.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#333333" text-anchor="middle">Works offline</text>
<text x="24.0" y="530.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#6E6E6E" text-anchor="start" font-style="italic">Coming next: relief ratings, history and trends,</text>
<text x="24.0" y="550.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#6E6E6E" text-anchor="start" font-style="italic">and a report to share with your doctor.</text>
<text x="195.0" y="610.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#6E6E6E" text-anchor="middle">halo gives general information only and is not a</text>
<text x="195.0" y="626.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#6E6E6E" text-anchor="middle">substitute for medical advice.</text>
<text x="195.0" y="650.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#6E6E6E" text-anchor="middle">Version 1.0</text>
